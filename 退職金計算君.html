<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退職金計算君</title>
<style>
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Meiryo",sans-serif;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}
.card{
    max-width:600px;
    margin:auto;
    background:#fff;
    border-radius:16px;
    padding:24px;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    line-height:1.8;
}
h1{
    font-size:20px;
    margin:0 0 16px;
}
.bookmarklet{
    display:inline-block;
    background:#d60000;
    color:#fff;
    text-decoration:none;
    font-weight:bold;
    padding:14px 20px;
    border-radius:8px;
    cursor:grab;
    margin:16px 0;
}
.steps{
    background:#f3fcff;
    border:1px solid #89d8ee;
    border-radius:8px;
    padding:16px 20px;
    margin-top:20px;
}
.steps li{
    margin-bottom:8px;
}
.note{
    color:#666;
    font-size:13px;
    margin-top:20px;
}
</style>
</head>
<body>

<div class="card">

<h1>退職金計算君</h1>

<p>下の赤いボタンを、ブラウザの<b>お気に入りバー(ブックマークバー)</b>へドラッグ&ドロップしてください。</p>

<a class="bookmarklet" href="https://yoshihideyamada-cmd.github.io/retirement-calc/">退職金計算君</a>

<div class="steps">
<ol>
<li>お気に入りバーが見えないときは、<b>Ctrl + Shift + B</b> で表示します。</li>
<li>上の赤いボタンを、お気に入りバーまでドラッグして離します。</li>
<li>使うときは、お気に入りバーの「退職金計算君」をクリックします。</li>
</ol>
</div>

<div class="note">
生年月日・入社区分・退職事由を入れると、雇入れ日・退職日・本給(年齢給)が自動で入ります。<br>
規則から算出した試算です。実際の支給額は会社の決定によります。
</div>

</div>

</body>
</html>
