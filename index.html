<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退職金計算君</title>
<meta name="theme-color" content="#d60000">
<style>
*{box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Meiryo",sans-serif;background:#f5f5f5;margin:0;padding:20px;-webkit-text-size-adjust:100%;color:#222;}
.card{max-width:600px;margin:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 12px rgba(0,0,0,.1);}
h1{text-align:center;margin:0 0 6px;}
.subtitle{text-align:center;color:#666;font-size:14px;margin-bottom:22px;}
label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px;}
input,select{width:100%;font-size:17px;padding:10px;border:1px solid #ccc;border-radius:8px;background:#fff;}
.row{display:flex;gap:10px;align-items:center;}
.row>*{flex:1;}
.pos{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.pos span.name{width:3.2em;font-weight:700;}
.pos input{width:5.5em;flex:none;}
.hint{color:#777;font-size:12px;margin-top:4px;}
button{width:100%;margin-top:22px;padding:14px;font-size:18px;font-weight:700;color:#fff;background:#d60000;border:0;border-radius:10px;cursor:pointer;}
.result{margin-top:24px;border-top:1px solid #e5e5e5;padding-top:18px;}
.total{background:#fff4f4;border:2px solid #d60000;border-radius:12px;padding:14px;text-align:center;margin-bottom:14px;}
.total .num{font-size:30px;font-weight:700;color:#d60000;}
.total .none{font-size:20px;font-weight:700;color:#555;}
table{width:100%;border-collapse:collapse;font-size:14px;}
td{padding:7px 4px;border-bottom:1px solid #eee;vertical-align:top;}
td.v{text-align:right;white-space:nowrap;}
.notes{font-size:13px;color:#b00000;margin-top:12px;}
.notes p{margin:4px 0;}
.foot{font-size:12px;color:#888;margin-top:18px;line-height:1.6;}
#ptsBlock[hidden]{display:none;}
</style>
</head>
<body>
<div class="card">
<h1>退職金計算君</h1>
<div class="subtitle">退職金規則にもとづく試算</div>

<label for="birth">生年月日</label>
<input type="text" id="birth" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="例: 19800815">
<div class="hint" id="birthHint">数字8桁で入力してください(例: 19800815)。</div>

<label for="kind">入社区分</label>
<select id="kind">
 <option value="kosotsu">高卒(18歳の4/1入社)</option>
 <option value="kosen">高専卒(20歳の4/1入社)</option>
 <option value="daisotsu">大卒(22歳の4/1入社)</option>
 <option value="chuto">中途(入社日を入力)</option>
</select>

<label for="hire">雇入れ日(入社日)</label>
<input type="text" id="hire" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="例: 20150401" readonly>
<div class="hint" id="hireHint"></div>

<label for="reason">退職事由</label>
<select id="reason">
 <option value="teinen" selected>A　定年退職</option>
 <option value="jiko">B　自己都合退職(勤続5年未満は不支給)</option>
</select>

<label for="retire">退職日</label>
<input type="text" id="retire" inputmode="numeric" autocomplete="off" maxlength="10" placeholder="例: 20300331" readonly>
<div class="hint" id="retireHint"></div>

<div id="ptsBlock" hidden>
 <label>役職経験年数(主事職能以上・A欄のみ・該当なしは空欄)</label>
 <div class="pos"><span class="name">主事</span><input type="number" id="shujiY" min="0" step="1" placeholder="年" inputmode="numeric">年</div>
 <div class="pos"><span class="name">参事</span><input type="number" id="sanjiY" min="0" step="1" placeholder="年" inputmode="numeric">年</div>
 <div class="pos"><span class="name">参与</span><input type="number" id="sanyoY" min="0" step="1" placeholder="年" inputmode="numeric">年</div>
 <div class="hint">年間ポイント: 主事10P・参事50P・参与70P、1ポイント5,000円</div>

 <label for="kourou">功労係数(0.6〜1.2)</label>
 <select id="kourou"></select>
 <div class="hint">会社が決定する係数です。不明な場合は1.0のままにしてください。</div>
</div>

<label for="honkyu">退職時の本給(円)</label>
<div class="row">
 <input type="number" id="honkyu" inputmode="numeric" min="0" step="1" placeholder="生年月日と退職日から自動で入ります">
 <button type="button" id="honkyuAuto" style="margin:0;padding:10px;font-size:13px;flex:none;width:auto;background:#555">年齢給で自動計算</button>
</div>
<div class="hint" id="honkyuHint">本給は年齢給(本給規則 表-1)の額です。直接入力して変更もできます。</div>

<button type="button" id="calcBtn">計算する</button>

<div class="result" id="result" hidden></div>

<div class="foot">
規則(退職金規則 第1〜10条・別表1)から算出した試算です。実際の支給額は会社の決定によります。<br>
勤続年数は雇入れ日起算・退職日を含めて数え、1年未満の端数は月割(係数を月数で按分)、1ヶ月未満の端数は切り上げ。最終金額は1,000円未満を切り上げます。
</div>
</div>

<script src="calc.js?v=3"></script>
<script>
(function(){
 var R=window.Retirement;
 var $=function(id){return document.getElementById(id);};

 function slash(d){return d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2);}
 function toHalf(s){
  return String(s||'').replace(/[０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0);}).replace(/[／－ー．]/g,'/');
 }
 function formatDateField(el){
  var s=toHalf(el.value);
  var p=s.split(/[\/\-.]/);
  if(p.length>=3){
   var dig=function(x,n){return x.replace(/\D/g,'').slice(0,n);};
   el.value=dig(p[0],4)+'/'+dig(p[1],2)+'/'+dig(p.slice(2).join(''),2);
   return;
  }
  var d=s.replace(/\D/g,'').slice(0,8);
  el.value=d.length>6?d.slice(0,4)+'/'+d.slice(4,6)+'/'+d.slice(6):(d.length>4?d.slice(0,4)+'/'+d.slice(4):d);
 }
 function parseDateText(s){
  s=toHalf(s);
  var y,m,dd,t=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(t){y=+t[1];m=+t[2];dd=+t[3];}
  else{
   var d=s.replace(/\D/g,'');
   if(d.length!==8)return null;
   y=+d.slice(0,4);m=+d.slice(4,6);dd=+d.slice(6,8);
  }
  var dt=new Date(y,m-1,dd);
  if(dt.getFullYear()!==y||dt.getMonth()!==m-1||dt.getDate()!==dd)return null;
  return dt;
 }
 function bindDateField(el,hint,prompt,onValid,onInvalid){
  var composing=false;
  function process(){
   if(el.readOnly)return;
   formatDateField(el);
   if(parseDateText(el.value)){hint.textContent='';hint.style.color='';onValid();return;}
   var complete=/^\d{4}\/\d{1,2}\/\d{1,2}$/.test(el.value)||el.value.replace(/\D/g,'').length>=8;
   hint.textContent=complete?'日付として正しくありません。もう一度入力してください。':prompt;
   hint.style.color=complete?'#b00000':'';
   if(onInvalid)onInvalid();
  }
  el.addEventListener('compositionstart',function(){composing=true;});
  el.addEventListener('compositionend',function(){composing=false;process();});
  el.addEventListener('input',function(){if(!composing)process();});
  el.addEventListener('change',process);
 }
 function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP');}
 function jdate(d){return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}
 function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

 var ko=$('kourou');
 for(var k=6;k<=12;k++){
  var o=document.createElement('option');
  o.value=(k/10).toFixed(1);
  o.textContent=(k/10).toFixed(1);
  if(k===10)o.selected=true;
  ko.appendChild(o);
 }

 var honkyuManual=false;
 function autoHonkyu(force){
  if(honkyuManual&&!force)return;
  var b=parseDateText($('birth').value),d=parseDateText($('retire').value);
  var hint=$('honkyuHint');
  if(!b||!d)return;
  var h=R.honkyuAt(b,d);
  if(h.amount===null){
   hint.textContent='退職時の学齢'+h.age+'歳は年齢給(表-1)にありません。本給を直接入力してください。';
   return;
  }
  $('honkyu').value=h.amount;
  honkyuManual=false;
  hint.textContent='年齢給(表-1): 学齢'+h.age+'歳'+(h.capped?'は表の上限(53歳)の額':'の額')+' '+yen(h.amount)+' を入力しました(直近の2/1昇給・4/1現在の学齢で判定)。直接入力して変更もできます。';
 }
 $('honkyu').addEventListener('input',function(){honkyuManual=true;});
 $('honkyuAuto').addEventListener('click',function(){
  if(!parseDateText($('birth').value)||!parseDateText($('retire').value)){alert('生年月日と退職日を入力してください。');return;}
  autoHonkyu(true);
 });
 bindDateField($('retire'),$('retireHint'),'退職日を数字8桁で入力してください(例: 20300331)。',function(){autoHonkyu(false);});

 function autoDates(fromKind){
  var b=parseDateText($('birth').value);
  var kind=$('kind').value;
  if(fromKind&&kind==='chuto')$('hire').value='';
  if(!b)return;
  var e=R.entryDate(b,kind);
  if(e)$('hire').value=slash(e);
  if($('reason').value==='teinen')$('retire').value=slash(R.retireDate(b));
  autoHonkyu(false);
 }
 bindDateField($('birth'),$('birthHint'),'数字8桁で入力してください(例: 19800815)。',function(){autoDates(false);},function(){
  if($('kind').value!=='chuto')$('hire').value='';
  if($('reason').value==='teinen')$('retire').value='';
 });
 function syncKind(fromKind){
  var manual=$('kind').value==='chuto';
  var hire=$('hire');
  hire.readOnly=!manual;
  hire.style.background=manual?'#fff':'#f0f0f0';
  var hint=$('hireHint');
  hint.style.color='';
  hint.textContent=manual?'中途入社は入社日を数字8桁で入力してください(例: 20150401)。':'生年月日と入社区分から、卒業年の4/1が自動で入ります。';
  autoDates(fromKind);
  if(fromKind&&manual)hire.focus();
 }
 function syncReason(fromChange){
  var r=R.REASONS[$('reason').value];
  $('ptsBlock').hidden=r.column!=='A';
  var manual=$('reason').value==='jiko';
  var retire=$('retire'),hint=$('retireHint');
  retire.readOnly=!manual;
  retire.style.background=manual?'#fff':'#f0f0f0';
  hint.style.color='';
  if(manual){
   hint.textContent='退職日を入力してください(数字8桁 例: 20300331)。';
   if(fromChange){retire.value='';retire.focus();}
  }else{
   hint.textContent='満65歳に達した年度の3/31が自動で入ります(生年月日が必要です。規則上の定年は満60歳、希望者は65歳まで再雇用)。';
   var b=parseDateText($('birth').value);
   if(b)retire.value=slash(R.retireDate(b));
  }
  autoHonkyu(false);
 }
 $('reason').addEventListener('change',function(){syncReason(true);});
 $('kind').addEventListener('change',function(){syncKind(true);});
 bindDateField($('hire'),$('hireHint'),'入社日を数字8桁で入力してください(例: 20150401)。',function(){});
 syncKind(false);
 syncReason(false);

 function pos(a){return {y:$(a).value,m:0};}

 $('calcBtn').addEventListener('click',function(){
  var hire=parseDateText($('hire').value),retire=parseDateText($('retire').value);
  var honkyu=+$('honkyu').value;
  var box=$('result');
  if(!hire||!retire){alert('雇入れ日と退職日を入力してください。');return;}
  if(retire<hire){alert('退職日が雇入れ日より前になっています。');return;}
  var reasonKey=$('reason').value;
  if(!(honkyu>0)){alert('退職時の本給を入力してください。');return;}

  var r=R.calcRetirement({
   hire:hire,retire:retire,reason:reasonKey,honkyu:honkyu,
   pos:{shuji:pos('shujiY'),sanji:pos('sanjiY'),san_yo:pos('sanyoY')},
   kourou:+$('kourou').value
  });

  var h='';
  if(r.payable){
   h+='<div class="total"><div style="font-size:13px;color:#666">退職金(試算)</div><div class="num">'+yen(r.total)+'</div></div>';
  }else{
   h+='<div class="total"><div class="none">支給なし</div></div>';
  }

  var rows='';
  rows+='<tr><td>退職事由</td><td class="v">'+esc(r.reasonLabel)+(r.column?'(' +r.column+'欄)':'')+'</td></tr>';
  rows+='<tr><td>勤続期間</td><td class="v">'+r.years+'年'+r.remMonths+'ヶ月</td></tr>';
  if(r.payable){
   rows+='<tr><td>支給係数</td><td class="v">'+r.coef.toFixed(4)+'</td></tr>';
   rows+='<tr><td>本給 × 係数</td><td class="v">'+yen(honkyu)+' × '+r.coef.toFixed(4)+' = '+yen(r.base)+'</td></tr>';
   if(r.column==='A'){
    rows+='<tr><td>ポイント加算</td><td class="v">'+(Math.round(r.points*100)/100)+'P × '+R.POINT_YEN.toLocaleString('ja-JP')+'円 × 功労係数'+r.kourou.toFixed(1)+' = '+yen(r.pointsAmount)+'</td></tr>';
   }
   rows+='<tr><td>合計(切り上げ前)</td><td class="v">'+yen(r.subtotal)+'</td></tr>';
   rows+='<tr><td><b>退職金(1,000円未満切り上げ)</b></td><td class="v"><b>'+yen(r.total)+'</b></td></tr>';
   rows+='<tr><td>支給期限</td><td class="v">'+jdate(r.dueDate)+'まで</td></tr>';
  }
  h+='<table>'+rows+'</table>';
  if(r.notes.length){
   h+='<div class="notes">'+r.notes.map(function(n){return '<p>'+esc(n)+'</p>';}).join('')+'</div>';
  }
  box.innerHTML=h;
  box.hidden=false;
  box.scrollIntoView({behavior:'smooth',block:'nearest'});
 });
})();
</script>
</body>
</html>
